<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ping 網路診斷</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">NETWORK DIAGNOSTICS</div>
      <h1>Ping 網路診斷</h1>
      <p class="intro">測試目標 IP 的連線狀態與網路延遲。</p>

      <form id="ping-form">
        <label for="host">目標 IP 位址</label>
        <input id="host" name="host" type="text" value="127.0.0.1"
               placeholder="例如 127.0.0.1" autocomplete="off" required>

        <label for="count">Ping 次數</label>
        <input id="count" name="count" type="number" min="1" max="20" value="4" required>

        <button id="submit-button" type="submit">
          <span id="button-label">開始 Ping</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <section id="result" class="result" aria-live="polite" hidden>
        <div class="result-heading">
          <h2>測試結果</h2>
          <span id="status" class="status"></span>
        </div>
        <p id="result-target" class="result-target"></p>
        <div class="metrics">
          <div class="metric">
            <span class="metric-label">平均 RTT</span>
            <strong id="rtt">—</strong>
          </div>
          <div class="metric">
            <span class="metric-label">封包丟失</span>
            <strong id="loss">—</strong>
          </div>
        </div>
      </section>
      <p id="error" class="error" role="alert" hidden></p>
      <p class="footnote">最多可測試 20 次；每次等待回應最多 1 秒。</p>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
